<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novo produto - ProdManager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='base.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='components.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='produtos.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='menu.css') }}"
    >
</head>

<body>

<header class="app-header">
    <h1>
        <a
            href="{{ url_for('inicio_page') }}"
            class="app-brand"
        >
            prodmanager
        </a>
    </h1>

    {% include "_menu.html" %}
</header>

<main class="app-main">

    <div class="page-heading">
        <div class="page-heading-content">
            <span class="page-eyebrow">
                Catálogo
            </span>

            <h2 class="page-title">
                Cadastrar produto
            </h2>

            <p class="page-description">
                Defina os dados principais e crie uma ou
                mais variantes de estoque.
            </p>
        </div>

        <a
            href="{{ url_for('estoque_page') }}"
            class="button button-secondary"
        >
            Consultar estoque
        </a>
    </div>

    <form id="produto-form" class="product-form">

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h3 class="panel-title">
                        Informações principais
                    </h3>

                    <p class="panel-description">
                        Identificação geral do produto.
                    </p>
                </div>
            </div>

            <div class="panel-body">
                <div class="form-grid">
                    <div class="form-field">
                        <label
                            for="produto-linha"
                            class="form-label"
                        >
                            Nome da linha
                        </label>

                        <input
                            type="text"
                            id="produto-linha"
                            class="form-control"
                            placeholder="Ex.: Espelho Prime"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label
                            for="produto-formato"
                            class="form-label"
                        >
                            Formato
                        </label>

                        <input
                            type="text"
                            id="produto-formato"
                            class="form-control"
                            placeholder="Ex.: Redondo"
                            required
                        >
                    </div>

                    <div
                        class="
                            form-field
                            form-field-full
                        "
                    >
                        <label
                            for="produto-descricao"
                            class="form-label"
                        >
                            Descrição
                        </label>

                        <textarea
                            id="produto-descricao"
                            class="form-control"
                            placeholder="Descreva as características do produto"
                        ></textarea>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <div>
                    <h3 class="panel-title">
                        Variantes
                    </h3>

                    <p class="panel-description">
                        Dimensões, acabamento, preço e
                        estoque de cada SKU.
                    </p>
                </div>

                <button
                    type="button"
                    id="add-variant"
                    class="button button-primary button-small"
                >
                    Adicionar variante
                </button>
            </div>

            <div class="panel-body">
                <div
                    id="variant-list"
                    class="variants-list"
                ></div>
            </div>
        </section>

        <div
            id="resultado"
            class="alert"
            hidden
        ></div>

        <div class="product-footer">
            <button
                type="reset"
                class="button button-secondary"
            >
                Limpar formulário
            </button>

            <button
                type="submit"
                class="button button-primary"
            >
                Cadastrar produto
            </button>
        </div>

    </form>

</main>

<script>
let variantes = [];

const listaVariantes = document.getElementById(
    "variant-list"
);

function atualizarTitulosVariantes() {
    listaVariantes
        .querySelectorAll(".variant-card")
        .forEach((card, indice) => {
            card.querySelector(
                ".variant-title"
            ).textContent = `Variante ${indice + 1}`;
        });
}

function adicionarVariante() {
    const id =
        Date.now() + Math.floor(Math.random() * 1000);

    variantes.push(id);

    const card = document.createElement("article");

    card.className = "variant-card";
    card.dataset.variantId = id;

    card.innerHTML = `
        <div class="variant-header">
            <h4 class="variant-title">
                Variante ${variantes.length}
            </h4>

            <button
                type="button"
                class="
                    button
                    button-danger
                    button-small
                "
                onclick="removerVariante(${id})"
            >
                Remover
            </button>
        </div>

        <div class="variant-grid">
            <div class="form-field">
                <label class="form-label">
                    Altura (cm)
                </label>

                <input
                    type="number"
                    class="form-control altura"
                    min="0"
                    step="0.1"
                    placeholder="Ex.: 100"
                >
            </div>

            <div class="form-field">
                <label class="form-label">
                    Largura (cm)
                </label>

                <input
                    type="number"
                    class="form-control largura"
                    min="0"
                    step="0.1"
                    placeholder="Ex.: 80"
                >
            </div>

            <div class="form-field">
                <label class="form-label">
                    Cor
                </label>

                <input
                    type="text"
                    class="form-control cor"
                    placeholder="Ex.: Prata"
                >
            </div>

            <div class="form-field">
                <label class="form-label">
                    Moldura
                </label>

                <input
                    type="text"
                    class="form-control moldura"
                    placeholder="Ex.: Alumínio"
                >
            </div>

            <div class="form-field">
                <label class="form-label">
                    Preço base
                </label>

                <input
                    type="number"
                    class="form-control preco"
                    min="0"
                    step="0.01"
                    placeholder="R$ 0,00"
                    required
                >
            </div>

            <div class="form-field">
                <label class="form-label">
                    Estoque inicial
                </label>

                <input
                    type="number"
                    class="form-control estoque"
                    min="0"
                    step="1"
                    value="0"
                    required
                >
            </div>
        </div>

        <div class="variant-options">
            <label class="checkbox-control">
                <input
                    type="checkbox"
                    class="led_direto"
                >
                LED direto
            </label>

            <label class="checkbox-control">
                <input
                    type="checkbox"
                    class="led_indireto"
                >
                LED indireto
            </label>
        </div>
    `;

    listaVariantes.appendChild(card);
}

function removerVariante(id) {
    if (variantes.length === 1) {
        mostrarResultado(
            "O produto precisa possuir pelo menos uma variante.",
            false
        );

        return;
    }

    variantes = variantes.filter(
        varianteId => varianteId !== id
    );

    listaVariantes
        .querySelector(`[data-variant-id="${id}"]`)
        ?.remove();

    atualizarTitulosVariantes();
}

function mostrarResultado(texto, sucesso) {
    const resultado = document.getElementById(
        "resultado"
    );

    resultado.hidden = false;

    resultado.className = sucesso
        ? "alert alert-success"
        : "alert alert-danger";

    resultado.textContent = texto;
}

document
    .getElementById("add-variant")
    .addEventListener("click", adicionarVariante);

document
    .getElementById("produto-form")
    .addEventListener("reset", () => {
        setTimeout(() => {
            variantes = [];
            listaVariantes.innerHTML = "";
            adicionarVariante();

            document.getElementById(
                "resultado"
            ).hidden = true;
        });
    });

document
    .getElementById("produto-form")
    .addEventListener("submit", async evento => {
        evento.preventDefault();

        const botao = evento.currentTarget.querySelector(
            'button[type="submit"]'
        );

        const linha = document
            .getElementById("produto-linha")
            .value
            .trim();

        const formato = document
            .getElementById("produto-formato")
            .value
            .trim();

        const descricao = document
            .getElementById("produto-descricao")
            .value
            .trim();

        const variantesDados = [];

        document
            .querySelectorAll(".variant-card")
            .forEach(card => {
                variantesDados.push({
                    altura_cm:
                        parseFloat(
                            card.querySelector(".altura").value
                        ) || null,

                    largura_cm:
                        parseFloat(
                            card.querySelector(".largura").value
                        ) || null,

                    cor:
                        card.querySelector(".cor").value.trim()
                        || null,

                    moldura:
                        card.querySelector(".moldura").value.trim()
                        || null,

                    preco_base:
                        parseFloat(
                            card.querySelector(".preco").value
                        ) || 0,

                    estoque_inicial:
                        parseInt(
                            card.querySelector(".estoque").value
                        ) || 0,

                    led_direto:
                        card.querySelector(
                            ".led_direto"
                        ).checked,

                    led_indireto:
                        card.querySelector(
                            ".led_indireto"
                        ).checked
                });
            });

        const payload = {
            linha: linha,
            formato: formato,
            descricao: descricao,
            variantes: variantesDados
        };

        botao.disabled = true;
        botao.textContent = "Cadastrando...";

        try {
            const resposta = await fetch(
                "/produto/variantes",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                }
            );

            const resultado = await resposta.json();

            if (!resposta.ok || !resultado.produto_id) {
                throw new Error(
                    resultado.error ||
                    resultado.mensagem ||
                    "Não foi possível cadastrar o produto"
                );
            }

            mostrarResultado(
                `Produto cadastrado com sucesso. ` +
                `Código #${resultado.produto_id}.`,
                true
            );

            evento.currentTarget.reset();

        } catch (erro) {
            mostrarResultado(
                erro.message,
                false
            );

        } finally {
            botao.disabled = false;
            botao.textContent = "Cadastrar produto";
        }
    });

adicionarVariante();
</script>

</body>
</html>
