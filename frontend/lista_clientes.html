<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista de Clientes - Mev Glass OS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
<header class="app-header">
    <h1>
        <a href="{{ url_for('inicio_page') }}" class="app-brand">
            prodmanager
        </a>
    </h1>

    {% include "_menu.html" %}
</header>

<main>
  <section>
    <h2>Clientes Cadastrados</h2>
    <table id="clientes-table">
      <thead><tr><th>Nome</th><th>Email</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script>
async function carregarClientes() {
    const tbody = document.querySelector(
        "#clientes-table tbody"
    );

    tbody.innerHTML = `
        <tr>
            <td colspan="2">Carregando clientes...</td>
        </tr>
    `;

    try {
        const resposta = await fetch("/api/clientes");
        const clientes = await resposta.json();

        if (!resposta.ok) {
            throw new Error(
                clientes.mensagem ||
                "Não foi possível carregar os clientes"
            );
        }

        tbody.innerHTML = "";

        if (clientes.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="2">
                        Nenhum cliente cadastrado.
                    </td>
                </tr>
            `;

            return;
        }

        clientes.forEach(cliente => {
            const linha = document.createElement("tr");

            const colunaNome = document.createElement("td");
            colunaNome.textContent = cliente.nome;

            const colunaEmail = document.createElement("td");
            colunaEmail.textContent = cliente.email;

            linha.appendChild(colunaNome);
            linha.appendChild(colunaEmail);

            tbody.appendChild(linha);
        });

    } catch (erro) {
        tbody.innerHTML = `
            <tr>
                <td colspan="2">
                    ${erro.message}
                </td>
            </tr>
        `;
    }
}

carregarClientes();
</script>
</body>
</html>
