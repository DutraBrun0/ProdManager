<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estoque - Mev Glass OS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
    /* --- ESTILO CLEAN & SUAVE (PADRÃO MEV GLASS) --- */
    :root {
        --bg-body: #f8fafc;
        --bg-card: #ffffff;
        --bg-container: #f1f5f9; /* Fundo do bloco interno */
        --border-subtle: #e2e8f0;
        --text-main: #334155;
        --text-muted: #64748b;
        --primary: #0f172a; 
        --blue-btn: #3b82f6;
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        --danger: #ef4444;
    }

    body {
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding-bottom: 60px;
    }

    /* Header */
    header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-subtle);
        padding: 15px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    header h1 a { color: var(--primary); text-decoration: none; font-weight: 700; font-size: 1.2rem; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: 0.2s; }
    nav a:hover { color: var(--primary); }

    /* Layout Styles */
    main { max-width: 950px; margin: 40px auto; padding: 0 20px; } /* Um pouco mais largo para a tabela */

    /* Card Principal */
    .card {
        background: var(--bg-card);
        padding: 40px;
        border-radius: 16px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-subtle);
        display: block !important;
    }

   .page-header {
    margin-bottom: 20px;
    display: block !important;
}

    /* --- BLOCO DA TABELA (O "Bloco Dentro") --- */
    .table-container {
        background-color: var(--bg-container);
        border: 1px dashed var(--border-subtle);
        border-radius: 12px;
        padding: 20px;
        overflow-x: auto; /* Garante rolagem se a tabela for muito larga */
    }

    /* Estilização da Tabela Clean */
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        text-align: left;
    }

    thead tr {
        background-color: transparent;
    }

    th {
        padding: 12px 15px;
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border-subtle);
    }

    td {
        padding: 15px;
        font-size: 0.95rem;
        color: var(--text-main);
        border-bottom: 1px solid #e2e8f0;
        background-color: #fff; /* Linhas brancas */
    }

    /* Arredondar cantos da primeira e última linha para estética */
    tbody tr:first-child td:first-child { border-top-left-radius: 8px; }
    tbody tr:first-child td:last-child { border-top-right-radius: 8px; }
    tbody tr:last-child td:first-child { border-bottom-left-radius: 8px; }
    tbody tr:last-child td:last-child { border-bottom-right-radius: 8px; }
    
    /* Remove borda da última linha */
    tbody tr:last-child td { border-bottom: none; }

    /* Hover na linha */
    tbody tr { cursor: pointer; transition: transform 0.1s, box-shadow 0.1s; }
    tbody tr:hover td {
        background-color: #f8fafc; /* Leve destaque ao passar o mouse */
        color: var(--primary);
    }

    /* Destaques específicos */
    .sku-tag {
        font-family: monospace;
        background: #f1f5f9;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        color: var(--text-muted);
    }
    
    .qtd-destaque {
        font-weight: 700;
        color: var(--blue-btn); /* Azul do tema */
    }

.barra-estoque {
    display: block;
    width: 100%;
    margin-bottom: 14px;;
}

.btn-movimentacao {
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 5px 9px;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
}

.btn-movimentacao:hover {
    color: var(--primary);
    background-color: #f1f5f9;
}
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background-color: rgba(15, 23, 42, 0.55);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal-overlay.ativo {
    display: flex;
}

.modal-conteudo {
    background-color: white;
    width: 100%;
    max-width: 430px;
    padding: 28px;
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
}

.modal-conteudo h3 {
    margin: 0 0 20px;
    color: var(--primary);
}

.campo-modal {
    margin-bottom: 16px;
}

.campo-modal label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    font-weight: 600;
}

.campo-modal input,
.campo-modal select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    font: inherit;
    box-sizing: border-box;
}

.modal-acoes {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.btn-cancelar,
.btn-confirmar {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-weight: 600;
    cursor: pointer;
}

.btn-cancelar {
    background-color: #e2e8f0;
    color: var(--text-main);
}

.btn-confirmar {
    background-color: var(--primary);
    color: white;
}

.mensagem-modal {
    display: none;
    margin: 12px 0 0;
    padding: 9px 11px;
    border-radius: 7px;
    font-size: 0.85rem;
}

.mensagem-modal.erro {
    display: block;
    background-color: #fee2e2;
    color: #991b1b;
}

.mensagem-modal.sucesso {
    display: block;
    background-color: #dcfce7;
    color: #166534;
}
</style>
</head>

<body>
<header>
<h1><a href="{{ url_for('inicio_page') }}">prodmanager</a></h1>
  <nav>
    <a href="{{ url_for('produtos_page') }}">Produtos</a>
    <a href="{{ url_for('clientes_page') }}">Clientes</a>
    <a href="{{url_for('lista_cliente_page')}}">Lista Clientes</a>
    <a href="{{ url_for('estoque_page') }}">Estoque</a>
    <a href="{{ url_for('faturamento_page') }}">Faturamento</a>
  </nav>
</header>

<main>
<div class="card">

<div class="page-header">
    <h2>Controle de Estoque</h2>
    <span class="subtitle">
        Acompanhe as quantidades e registre movimentações.
    </span>
</div>

<div class="barra-estoque">
    <button
        type="button"
        class="btn-movimentacao"
        onclick="abrirMovimentacao()">
        + Movimentar
    </button>
</div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>SKU</th>
                    <th>Produto</th>
                    <th>Dimensões</th>
                    <th>Cor / Moldura</th>
                    <th>Preço Base</th>
                    <th>Quantidade</th>
                </tr>
                </thead>
                <tbody id="tabela-estoque">
                    </tbody>
            </table>
        </div>
    </div>
</main>

<div id="modal-movimentacao" class="modal-overlay">
    <div class="modal-conteudo">
        <h3>Registrar movimentação</h3>

        <form id="form-movimentacao">
            <div class="campo-modal">
                <label for="movimento-produto">Produto / Variante</label>
                <select id="movimento-produto" required>
                    <option value="">Selecione um produto</option>
                </select>
            </div>

            <div class="campo-modal">
                <label for="movimento-tipo">Tipo</label>
                <select id="movimento-tipo" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>

            <div class="campo-modal">
                <label for="movimento-quantidade">Quantidade</label>
                <input
                    id="movimento-quantidade"
                    type="number"
                    min="1"
                    step="1"
                    value="1"
                    required>
            </div>

            <div class="campo-modal">
                <label for="movimento-motivo">Motivo</label>
                <input
                    id="movimento-motivo"
                    type="text"
                    maxlength="120"
                    placeholder="Ex.: reposição de mercadoria"
                    required>
            </div>

            <p id="mensagem-movimentacao" class="mensagem-modal"></p>

            <div class="modal-acoes">
                <button
                    type="button"
                    class="btn-cancelar"
                    onclick="fecharMovimentacao()">
                    Cancelar
                </button>

                <button type="submit" class="btn-confirmar">
                    Confirmar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
async function carregarEstoque() {
  try {
    const req = await fetch("/estoque/variantes");
    const data = await req.json();

    const tbody = document.getElementById("tabela-estoque");
    tbody.innerHTML = "";

    const selectProduto = document.getElementById("movimento-produto");

    selectProduto.innerHTML = `
        <option value="">Selecione um produto</option>
`;

    data.forEach(v => {
      const tr = document.createElement("tr");
      
tr.innerHTML = `
    <td><span class="sku-tag">${v.sku}</span></td>
    <td>${v.nome_produto || v.produto_id}</td>
    <td>${v.altura_cm || ""} x ${v.largura_cm || ""}</td>
    <td>${v.cor || ""} / ${v.moldura || ""}</td>
    <td>R$ ${v.preco_base}</td>
    <td id="qtd-${v.variante_id}" class="qtd-destaque">${v.estoque}</td>
`;

const option = document.createElement("option");

option.value = v.variante_id;
option.textContent =
    `${v.sku} - ${v.nome_produto} (Estoque: ${v.estoque})`;

selectProduto.appendChild(option);
      
      tbody.appendChild(tr);
    });
  } catch (error) {
    console.error("Erro ao carregar estoque:", error);
  }
}

function abrirMovimentacao() {
    const modal = document.getElementById("modal-movimentacao");

    document.getElementById("movimento-produto").value = "";
    document.getElementById("movimento-tipo").value = "entrada";
    document.getElementById("movimento-quantidade").value = 1;
    document.getElementById("movimento-motivo").value = "";

    modal.classList.add("ativo");
}

function fecharMovimentacao() {
    const modal = document.getElementById("modal-movimentacao");
    modal.classList.remove("ativo");
}

document
    .getElementById("form-movimentacao")
    .addEventListener("submit", async function(event) {
        event.preventDefault();

        const varianteId = Number(
            document.getElementById("movimento-produto").value
        );

        const tipo = document.getElementById("movimento-tipo").value;

        const quantidade = Number(
            document.getElementById("movimento-quantidade").value
        );

        const motivo = document
            .getElementById("movimento-motivo")
            .value
            .trim();

        const mensagem = document.getElementById(
            "mensagem-movimentacao"
        );

        const botao = this.querySelector(".btn-confirmar");

        mensagem.className = "mensagem-modal";
        mensagem.textContent = "";

        if (!varianteId) {
            mensagem.className = "mensagem-modal erro";
            mensagem.textContent = "Selecione um produto.";
            return;
        }

        if (!Number.isInteger(quantidade) || quantidade <= 0) {
            mensagem.className = "mensagem-modal erro";
            mensagem.textContent =
                "Informe uma quantidade inteira maior que zero.";
            return;
        }

        if (!motivo) {
            mensagem.className = "mensagem-modal erro";
            mensagem.textContent = "Informe o motivo.";
            return;
        }

        botao.disabled = true;
        botao.textContent = "Salvando...";

        try {
            const req = await fetch(`/estoque/${tipo}_sku`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    variante_id: varianteId,
                    quantidade: quantidade,
                    motivo: motivo
                })
            });

            const res = await req.json();

            if (!req.ok || res.status !== "ok") {
                throw new Error(
                    res.mensagem ||
                    res.error ||
                    "Não foi possível movimentar o estoque."
                );
            }

            await carregarEstoque();

            mensagem.className = "mensagem-modal sucesso";
            mensagem.textContent =
                `Estoque atualizado para ${res.estoque_atual}.`;

            setTimeout(() => {
                fecharMovimentacao();
            }, 900);

        } catch (error) {
            mensagem.className = "mensagem-modal erro";
            mensagem.textContent = error.message;

        } finally {
            botao.disabled = false;
            botao.textContent = "Confirmar";
        }
    });

// Inicia o carregamento
carregarEstoque();
</script>
</body>
</html>
